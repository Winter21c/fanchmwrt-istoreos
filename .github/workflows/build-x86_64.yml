# GitHub Actions 在线编译 x86_64 固件
#
# 三种用法：
#   1. 手动触发：仓库页面 → Actions → 「构建 x86_64 固件」→ Run workflow
#      可以勾选是否创建 Release、是否上传构建产物。
#   2. 打 tag 自动发布：push 一个 v* 标签（如 v25.12.4-istoreos.3），
#      编译完成后自动创建同名 Release 并把镜像挂上去。
#   3. 定时构建（默认注释掉）：用来提前发现上游腐烂，见文件末尾说明。
#
name: 构建 x86_64 固件

on:
  workflow_dispatch:
    inputs:
      lan_ip:
        description: '管理地址（LAN IP），可带前缀长度。多网口机器生效'
        type: string
        default: '192.168.1.1'
      rootfs_size:
        description: 'rootfs 分区大小（MB）'
        type: choice
        options:
          - '512'
          - '1024'
          - '2048'
          - '4096'
          - '8192'
        default: '1024'
      enable_docker:
        description: '包含 Docker（dockerd + docker-compose + Dockerman 界面）'
        type: boolean
        default: true
      create_release:
        description: '构建成功后创建 Release'
        type: boolean
        default: false
      release_tag:
        description: 'Release 标签（留空 = 自动用 日期-时间）'
        type: string
        required: false
      upload_artifact:
        description: '把镜像作为构建产物上传（Actions 页面可直接下载）'
        type: boolean
        default: true

  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限；读取代码只需要读权限。
permissions:
  contents: write

# 同一分支/标签同时只跑一个，避免两次构建互相覆盖产物。
concurrency:
  group: build-x86_64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # 任务名里带上参数，这样运行列表一眼就能看出这次编的是什么配置 ——
    # 排查时不用点进去、也不用等日志（运行中的日志在 API 上是读不到的）。
    #
    # Docker 那一项要用 format() 包一层：直接写 `inputs.enable_docker || 'true'`
    # 会在用户**取消勾选**时得到 'true'（false 是假值，会走 || 的右半边），
    # 显示成与事实相反的「含 Docker」。format('{0}', false) 得到字符串 "false",
    # 是真值，就不会被 || 吃掉。
    name: >-
      编译 x86_64 · LAN=${{ inputs.lan_ip || '192.168.1.1' }} ·
      分区=${{ inputs.rootfs_size || '1024' }}MB ·
      Docker=${{ format('{0}', inputs.enable_docker) || 'true' }}
    runs-on: ubuntu-24.04
    # GitHub 单个 job 上限是 360 分钟。整棵 OpenWrt 在 4 核 runner 上
    # 大约 2～3 小时，这里留出余量但不超过上限。
    timeout-minutes: 350

    env:
      # 慢镜像保护：scripts/download.pl 会把 CURL_OPTIONS 拼进每一次 curl。
      # runner 在境外，但上游仍可能有个别镜像很慢，保留这个下限让它自动换源。
      CURL_OPTIONS: --speed-limit 51200 --speed-time 60

      # ---- 构建参数 --------------------------------------------------------
      # 由 scripts/apply-build-options.sh 消费，落成源码树里的改动。
      #
      # 注意：这里**不能**写成 `${{ inputs.x || 'default' }}`。
      # 对 boolean 输入，false 在 GitHub 表达式里是「假值」，`false || '1'`
      # 会得到 '1' —— 也就是说用户勾掉了 Docker，却仍然编进固件。
      # 所以直接传输入原值：push 触发时 inputs 为空字符串，
      # 由脚本自己判定「空 = 用默认」，语义单一且不会踩这个坑。
      LAN_IP: ${{ inputs.lan_ip }}
      ROOTFS_PARTSIZE: ${{ inputs.rootfs_size }}
      ENABLE_DOCKER: ${{ inputs.enable_docker }}

    steps:
      # ---------------------------------------------------------------------
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 不需要完整历史：scripts/getver.sh 是 try_version || try_git，
          # 树里的 version 文件已经提供了版本号。这样省掉 280MB 的 fetch。
          fetch-depth: 1

      # ---------------------------------------------------------------------
      # OpenWrt 全量编译需要约 30GB。GitHub 的 runner 根分区初始只有约 14GB
      # 可用，不清理会在编到一半时 "No space left on device"。
      - name: 释放磁盘空间
        run: |
          echo "=== 清理前 ==="
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/az \
            /usr/lib/jvm || true
          sudo apt-get clean
          echo "=== 清理后 ==="
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget time

      # ---------------------------------------------------------------------
      # 缓存下载的源码包（dl/，约 1.4GB）。
      # 主要不是为了省时间（编译才是大头），而是防止某个上游 tarball
      # 哪天消失导致构建失败 —— 命中缓存时压根不会去下载。
      # key 只跟 feeds.conf.default 走：它改了才说明包来源变了。
      - name: 缓存源码包
        uses: actions/cache@v4
        with:
          path: dl
          key: dl-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            dl-

      # ---------------------------------------------------------------------
      # 复用仓库里的构建脚本做「准备」阶段（feeds / 补丁 / 配置 / 校验），
      # 保证 CI 与本地构建用的是同一套逻辑；SKIP_BUILD 让它停在编译前，
      # 下载与编译分开成独立步骤，日志和重试边界都更清楚。
      - name: 准备（feeds / 补丁 / 配置 / 校验）
        env:
          SKIP_BUILD: '1'
        run: ./build-merged-x86_64.sh

      - name: 下载源码
        run: make -j"$(nproc)" download || echo "::warning::部分源码下载失败，编译阶段 make 会重试"

      - name: 编译固件
        run: make -j"$(nproc)" BUILD_LOG=1

      # ---------------------------------------------------------------------
      - name: 编译失败时输出日志
        if: failure()
        run: |
          echo "=== 最近修改的构建日志 ==="
          find logs -type f -name '*.txt' -printf '%T@ %p\n' 2>/dev/null \
            | sort -rn | head -3 | cut -d' ' -f2- \
            | while read -r f; do
                echo "----- $f -----"
                tail -60 "$f"
              done
          echo "=== 磁盘占用 ==="
          df -h /

      - name: 核验产物
        run: ./scripts/verify-merged-firmware.sh

      - name: 汇总产物信息
        id: summary
        run: |
          MANIFEST=$(ls -1 bin/targets/x86/64/*.manifest | head -1)
          PKGCOUNT=$(wc -l < "$MANIFEST")
          VERSION=$(cat bin/targets/x86/64/version.buildinfo 2>/dev/null || echo unknown)

          # 以脚本解析后的 .build-options 为准，而不是 inputs ——
          # 这样日志里显示的是真正生效的值（例如空输入被填成默认值）。
          OPT_DOCKER=$(sed -n 's/^FANCHMWRT_ENABLE_DOCKER=//p' .build-options)
          OPT_LANIP=$(sed -n 's/^FANCHMWRT_LAN_IP=//p' .build-options)
          OPT_SIZE=$(sed -n 's/^FANCHMWRT_ROOTFS_PARTSIZE=//p' .build-options)
          [ "$OPT_DOCKER" = "1" ] && OPT_DOCKER_TXT="包含" || OPT_DOCKER_TXT="不含"
          [ -n "$OPT_LANIP" ] || OPT_LANIP="192.168.1.1（FanchmWrt 默认）"

          # 纯主机名版本，给 Release 说明里的 URL 用。
          # .build-options 里存的是带前缀长度的形式（如 192.168.100.1/24），
          # 直接拼进 URL 会变成 http://192.168.100.1/24 —— 那是错的。
          OPT_LANIP_HOST="${OPT_LANIP%%/*}"

          {
            echo "pkgcount=$PKGCOUNT"
            echo "version=$VERSION"
            echo "opt_lanip=$OPT_LANIP"
            echo "opt_lanip_host=$OPT_LANIP_HOST"
            echo "opt_size=$OPT_SIZE"
            echo "opt_docker=$OPT_DOCKER_TXT"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### 构建成功"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 版本 | \`$VERSION\` |"
            echo "| 管理地址 | \`$OPT_LANIP\` |"
            echo "| rootfs 分区 | ${OPT_SIZE} MB |"
            echo "| Docker | $OPT_DOCKER_TXT |"
            echo "| 已安装软件包 | $PKGCOUNT 个 |"
            echo "| 核验 | 全部通过 |"
            echo ""
            echo "| 镜像 | 大小 |"
            echo "|---|---|"
            for f in bin/targets/x86/64/*-squashfs-combined-efi.img.gz \
                     bin/targets/x86/64/*-squashfs-combined.img.gz \
                     bin/targets/x86/64/*-ext4-combined-efi.img.gz \
                     bin/targets/x86/64/*-ext4-combined.img.gz; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------------
      - name: 上传构建产物
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-istoreos-x86_64
          # 只出 4 个镜像：squashfs / ext4 各含 efi 与非 efi。
          # TARGZ 已在 .config 里关掉，所以不会有 -targz-*；
          # x86 的 -rootfs.img.gz 是无条件产出的、没有开关可关，
          # 这里靠路径精确匹配把它们排除在外。
          path: |
            bin/targets/x86/64/*-squashfs-combined-efi.img.gz
            bin/targets/x86/64/*-squashfs-combined.img.gz
            bin/targets/x86/64/*-ext4-combined-efi.img.gz
            bin/targets/x86/64/*-ext4-combined.img.gz
            bin/targets/x86/64/sha256sums
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------------------
      - name: 确定 Release 标签
        id: tag
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.release_tag }}"
            [ -n "$TAG" ] || TAG="$(date -u +%Y%m%d-%H%M)-istoreos"
          fi
          # 标签会被写进 Release 说明模板（sed 替换）并当参数传给 gh，
          # 所以这里严格限定字符集 —— 既是防 sed 注入，也是挡住非法 git tag。
          case "$TAG" in
            *[!A-Za-z0-9._-]*|'')
              echo "::error::非法的 Release 标签：'$TAG'（只允许字母、数字、点、下划线、连字符）"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "将使用标签：$TAG"

      - name: 生成 Release 说明
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PKGCOUNT: ${{ steps.summary.outputs.pkgcount }}
          VERSION: ${{ steps.summary.outputs.version }}
          OPT_LANIP: ${{ steps.summary.outputs.opt_lanip }}
          OPT_LANIP_HOST: ${{ steps.summary.outputs.opt_lanip_host }}
          OPT_SIZE: ${{ steps.summary.outputs.opt_size }}
          OPT_DOCKER: ${{ steps.summary.outputs.opt_docker }}
        run: |
          # 用 bash 参数展开做模板替换，不用 sed。
          #
          # 原因是踩过坑：管理地址形如 192.168.100.1/24，
          # 而 sed 的 s/@LANIP@/192.168.100.1/24/g 会被替换值里的 /
          # 提前截断，报 "unknown option to `s'"，整个发布流程挂掉。
          # 除 / 之外，& 在 sed 替换里表示「匹配到的内容」、反斜杠也要转义，
          # 这类坑防不胜防。bash 的 ${var//pat/repl} 把替换值当字面量。
          #
          # 但有个例外要注意：bash 5.2 起 patsub_replacement 默认开启，
          # 它让替换值里的 & 也展开成「匹配到的内容」——
          # 于是 a&b 会变成 a@LANIP@b。当前的值（IP、数字、版本号）都不含 &，
          # 但关掉它零成本，顺手堵上。
          shopt -u patsub_replacement 2>/dev/null || true

          template="$(cat .github/release-notes.md)"
          template="${template//@TAG@/$TAG}"
          template="${template//@VERSION@/$VERSION}"
          template="${template//@PKGCOUNT@/$PKGCOUNT}"
          template="${template//@LANIP@/$OPT_LANIP_HOST}"
          template="${template//@LANIPFULL@/$OPT_LANIP}"
          template="${template//@ROOTSIZE@/$OPT_SIZE}"
          template="${template//@DOCKER@/$OPT_DOCKER}"
          template="${template//@DATE@/$(date -u +%Y-%m-%d)}"
          printf '%s\n' "$template" > /tmp/release-notes.md

          # 兜底自检：模板里有新占位符而这里漏了替换的话，
          # 宁可在这里失败，也不要发一份带着 @XXX@ 的 Release 出去。
          if grep -qE '@[A-Z_]+@' /tmp/release-notes.md; then
            echo "::error::Release 说明里仍有未替换的占位符："
            grep -oE '@[A-Z_]+@' /tmp/release-notes.md | sort -u
            exit 1
          fi

          echo "=== Release 说明预览 ==="
          head -30 /tmp/release-notes.md

      - name: 创建或更新 Release
        if: ${{ github.event_name == 'push' || inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          # 只挂 4 个镜像 + 校验和。
          # sha256sums 会覆盖 bin/ 下的全部产物（含没进 Release 的
          # -rootfs.img.gz），拿它校验这 4 个镜像是没问题的。
          ASSETS=$(ls -1 \
            bin/targets/x86/64/*-squashfs-combined-efi.img.gz \
            bin/targets/x86/64/*-squashfs-combined.img.gz \
            bin/targets/x86/64/*-ext4-combined-efi.img.gz \
            bin/targets/x86/64/*-ext4-combined.img.gz \
            bin/targets/x86/64/sha256sums)

          # 发布前兜底：确认恰好是 4 个镜像 + 1 个校验和。
          # 镜像类型配置被改坏（比如 TARGZ 又被打开）时会在这一步暴露，
          # 而不是稀里糊涂发一个多出好几个附件的 Release。
          IMG_COUNT=$(printf '%s\n' $ASSETS | grep -c '\.img\.gz$' || true)
          if [ "$IMG_COUNT" -ne 4 ]; then
            echo "::error::期望 4 个镜像，实际找到 $IMG_COUNT 个："
            printf '%s\n' $ASSETS
            exit 1
          fi
          echo "将发布的附件："
          printf '  %s\n' $ASSETS

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，同步附件"
            gh release upload "$TAG" $ASSETS --clobber
            # 删掉不在本次清单里的旧附件。
            # 不做这一步的话，重跑同一个标签（比如改了镜像类型配置）
            # 会把新旧附件混在一起，Release 上留着一堆用不到的旧文件。
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              [ -n "$name" ] || continue
              if printf '%s\n' $ASSETS | grep -qxF "bin/targets/x86/64/$name"; then
                echo "  保留 $name"
              else
                echo "  删除过期附件 $name"
                gh release delete-asset "$TAG" "$name" --yes || true
              fi
            done
            gh release edit "$TAG" --notes-file /tmp/release-notes.md
          else
            gh release create "$TAG" \
              --title "FanchmWrt × iStoreOS 融合固件 $TAG" \
              --notes-file /tmp/release-notes.md \
              $ASSETS
          fi
          echo "完成：$(gh release view "$TAG" --json url --jq .url)"

# ---------------------------------------------------------------------------
# 定时构建（可选）
#
# 上游会腐烂：例如 v2fly/domain-list-community 的数据 tag 只保留约三个月，
# 我们就被这个问题卡过一次（详见 MERGE-NOTES 4.3.1）。每周跑一次能在用户
# 之前发现这类问题，而不是等别人 clone 后构建失败来提 issue。
#
# 公开仓库的 Actions 额度是免费的，一周一次 3 小时的构建可以接受；
# 不需要的话保持注释即可。
# ---------------------------------------------------------------------------
#  schedule:
#    - cron: '0 2 * * 1'   # 每周一 02:00 UTC
